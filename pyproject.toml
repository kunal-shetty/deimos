[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deimos"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.4.0",
    "prompt_toolkit>=3.0.43",
    "pygments>=2.17.0",
]

[project.scripts]
deimos = "main:main"

[tool.setuptools]
py-modules = ["main", "config"]
packages = ["agent", "tools", "llm", "ui", "memory", "commands"]