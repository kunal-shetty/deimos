[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deimos"
version = "0.2.0"
description = "An autonomous coding agent for your terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.4.0",
    "prompt_toolkit>=3.0.43",
    "pygments>=2.17.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "typesafe-sdk>=0.7.5,<0.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.20.0"]

[project.urls]
Homepage = "https://github.com/kunal-shetty/deimos"

[project.scripts]
deimos = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "settings"]
packages = ["agent", "tools", "llm", "ui", "memory", "commands", "web", "auth", "prompts", "skills", "evals"]

[tool.setuptools.package-data]
prompts = ["*.txt", "*.md"]
memory = ["migrations/*.sql"]
skills = ["**/*"]
