name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Scripted evals (no API key, no network)
        run: python -m evals run

  install:
    name: Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install from this checkout
        env:
          DEIMOS_SOURCE: ${{ github.workspace }}
          DEIMOS_NO_MODIFY_PATH: "1"
        run: sh scripts/install.sh
      - run: ~/.local/bin/deimos --version

  install-windows:
    name: Installer on windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install from this checkout
        shell: pwsh
        env:
          DEIMOS_SOURCE: ${{ github.workspace }}
          DEIMOS_NO_MODIFY_PATH: "1"
        run: ./scripts/install.ps1
      - shell: pwsh
        run: ~/.deimos/venv/Scripts/deimos.exe --version
